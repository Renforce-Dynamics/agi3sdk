[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "Renforce Dynamics"}]
maintainers = [{name = "Renforce Dynamics"}]
readme = "README.md"
license = {file = "LICENSE"}
name = "agi3sdk"
version = "0.1.0"
requires-python = ">=3.10"
description = "A3 robot I/O for C++ and Python"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agi3sdk*"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/Renforce-Dynamics/agi3sdk"
Issues = "https://github.com/Renforce-Dynamics/agi3sdk/issues"
Documentation = "https://github.com/Renforce-Dynamics/agi3sdk#readme"
