[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agi3sdk"
version = "0.1.0"
requires-python = ">=3.10"
description = "agi3sdk: independent Cadence ecosystem component"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agi3sdk*"]

[tool.setuptools.package-data]
"*" = ["**/*.yaml", "**/*.json", "**/*.xml", "**/*.STL", "**/*.stl", "**/*.onnx", "**/*.npz", "**/*.hex", "**/*.md", "**/*.lock", "**/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
